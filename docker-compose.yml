services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: cdss_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --allowed-hosts *

  api:
    build: .
    container_name: cdss_api
    ports:
      - "8000:8000"

    depends_on:
      mlflow:
        condition: service_started

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    volumes:
      - ./mlruns:/mlruns

    command: >
      sh -c "
      echo 'Waiting for MLflow...' &&
      sleep 12 &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: cdss_prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - api

    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: cdss_grafana
    ports:
      - "3000:3000"